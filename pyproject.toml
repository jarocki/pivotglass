[project]
name = "pivotglass"
version = "0.9.8"
requires-python = ">=3.12"
description = "Gamified framework for hunting, pivoting, and discovery of adversary infrastructure, indicators, and TTPs"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "John Jarocki", email = "john@jarocki.me" },
]
keywords = ["threat-intelligence", "osint", "cti", "gamification", "pivotglass"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet",
]

dependencies = [
    "cmd2>=2.5",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "stix2>=3.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyfiglet>=1.0",
    "tomli_w>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/jarocki/pivotglass"
Repository = "https://github.com/jarocki/pivotglass"
"Bug Tracker" = "https://github.com/jarocki/pivotglass/issues"

[project.scripts]
pivotglass = "pivotglass.__main__:main"

[project.entry-points."pivotglass.modules"]
whois_lookup = "pivotglass.modules.osint.whois_lookup:WhoisLookup"
abuseipdb = "pivotglass.modules.osint.abuseipdb:AbuseIPDB"
urlscan = "pivotglass.modules.osint.urlscan:URLScan"
hibp = "pivotglass.modules.osint.hibp:HIBP"
otx = "pivotglass.modules.cti.otx:AlienVaultOTX"
shodan_ip = "pivotglass.modules.osint.shodan_ip:ShodanIP"
censys_host = "pivotglass.modules.osint.censys_host:CensysHost"
virustotal = "pivotglass.modules.cti.virustotal:VirusTotal"
passivetotal = "pivotglass.modules.cti.passivetotal:PassiveTotal"
greynoise = "pivotglass.modules.osint.greynoise:GreyNoise"
urlhaus = "pivotglass.modules.cti.urlhaus:URLHaus"
threatfox = "pivotglass.modules.cti.threatfox:ThreatFox"
malwarebazaar = "pivotglass.modules.cti.malwarebazaar:MalwareBazaar"
crtsh = "pivotglass.modules.osint.crtsh:CrtSh"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pivotglass"]

[tool.hatch.build.targets.wheel.force-include]
"web/out" = "pivotglass/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
agent = ["litellm>=1.0", "prompt-toolkit>=3.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
